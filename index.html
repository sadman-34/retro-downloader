<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="HandheldFriendly" content="true" />
  <meta name="MobileOptimized" content="240" />
  <title>LiteGet 240p</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>

  <div class="header">
    <strong>LiteGet</strong> <span class="badge">240p</span>
  </div>

  <div class="container">
    <form id="dl-form" action="/api/extract" method="get">
      <label for="video-url" class="lbl">Video URL:</label>
      <input type="text" id="video-url" name="url" class="inp" value="" placeholder="https://..." />

      <label for="quality" class="lbl">Format / Quality:</label>
      <select id="quality" name="quality" class="sel">
        <option value="144p">144p (3GP / Ultra Lite)</option>
        <option value="240p" selected="selected">240p (MP4 Standard)</option>
        <option value="360p">360p (MP4 High)</option>
        <option value="audio">Audio Only (MP3/M4A)</option>
      </select>

      <div class="btn-row">
        <input type="submit" id="submit-btn" class="btn" value="Get Link" />
        <input type="button" id="clear-btn" class="btn btn-sec" value="Clear" />
      </div>
    </form>

    <div id="status-box" class="box hidden">
      <div id="status-text">Ready.</div>
    </div>

    <div id="result-box" class="box result-box hidden">
      <div id="video-title" class="res-title"></div>
      <div id="video-meta" class="res-meta"></div>
      <a id="download-link" href="#" class="dl-btn">Download File</a>
    </div>
  </div>

  <div class="footer">
    Opera Mini 4.4 Ready • <a href="#config" id="toggle-cfg">API Settings</a>
    <div id="cfg-panel" class="cfg-panel hidden">
      <label for="api-base" class="lbl">Backend Endpoint:</label>
      <input type="text" id="api-base" class="inp" value="" />
      <input type="button" id="save-cfg" class="btn btn-sec" value="Save Endpoint" />
    </div>
  </div>

  <script type="text/javascript" src="app.js"></script>
</body>
</html>
