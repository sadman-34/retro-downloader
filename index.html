<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Downloader</title>
<meta name="description" content="Lightweight video link helper for feature phones">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="wrap">

  <h1>RETRO DOWNLOADER</h1>

  <!-- UPDATED: Points to your Render backend -->
  <form id="dl-form" action="https://retro-downloader-api.onrender.com/download" method="get" accept-charset="utf-8">

    <label for="url">Video link</label>
    <input type="text" id="url" name="url" value="" maxlength="1000" autocomplete="off">

    <label for="quality">Quality</label>
    <select id="quality" name="quality">
      <option value="144p">144p</option>
      <option value="240p" selected="selected">240p</option>
      <option value="360p">360p</option>
    </select>

    <input type="submit" id="go" value="Get download link">

  </form>

  <div id="status" class="status">Ready.</div>
  <div id="result"></div>

  <p class="foot">Static page &middot; powered by Render API.</p>

</div>

<script src="app.js"></script>
</body>
</html>
